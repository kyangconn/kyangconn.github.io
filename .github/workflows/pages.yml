name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          
      - name: Install Dependencies
        run: npm install
        
      - name: Build
        run: npm run build

      - name: Check Pages output
        run: |
          ls -la ./public
          test -f ./public/index.html
          find ./public -type l -print -quit | grep -q . && {
            echo "Symlink found in public; Pages artifact cannot contain symlinks"
            exit 1
          } || true
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 
        
  sync-to-esa:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          recursive: true
          
      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
      - name: Sync to esa-pages branch
        run: |
          git fetch origin esa-pages:esa-pages 2>/dev/null || true
          git checkout esa-pages 2>/dev/null || git checkout -b esa-pages

          git merge --no-commit --strategy-option=ours main || echo "Merge completed or no changes"

          git add .
          git commit -m "Sync from main [skip ci]" || echo "No changes to commit"

          git push origin esa-pages
